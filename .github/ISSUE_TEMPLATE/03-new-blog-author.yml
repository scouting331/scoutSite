name: New Blog Author
description: "Add a new author to the blog authors list"
title: "[New Author]"
labels: ["new-author"]
body:
  - type: markdown
    attributes:
      value: |
        **The title above is just for internal use. Please don't change it**
  - type: input
    id: name
    attributes:
      label: Author's Name
      description: | 
        Name shown in blog posts for the author
        
        NOTE: If you are a Scout this should be your first name followed by 
        a last initial, **NO LAST NAMES PLEASE**
        
        If you are an adult and want your last name shown, feel free to include it"
      placeholder: "Scout A"
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Title
      description: "List your position(s) and unit."
      placeholder: "Position, Troop ###"
    validations:
      required: true
  - type: upload
    id: image_url
    attributes:
      label: Avatar Image
      description: "This is the photo that will be associated with you. Please
        make sure the image size is relatively small and your face is centered in
        the image"
    validations:
      required: false
      accept: ".png, .jpg, .jpeg, .gif, .svg, .webp"

